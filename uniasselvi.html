<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniAsselvi - Pesquisa</title>
    <link rel="stylesheet" href="uni.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    
</head>
<body>
     <div class="icon">
       <a href="https://portal.uniasselvi.com.br/graduacao/alunos/bibliotecas">
        <button class="botao">Bibliotecas</button>
       </a>
       <a href="https://portal.uniasselvi.com.br/graduacao/alunos">
        <button class="botao">Alunos</button>
       </a>
        <span class="material-symbols-outlined">
            apps
        </span>
  
        <button class="bav">Ambiente Virtual</button>
    </div>
    <main class="page-center">
    
        <div class="search-app">
            <img src="img/uniasselvi-logo-png_seeklogo-434116.png" alt="logo uni">

            <form class="search-form" action="https://www.google.com/search" method="GET" role="search">
                <div class="search-box">
                    <!-- ícone de lupa (inline SVG) -->
                    <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 15a5 5 0 110-10 5 5 0 010 10z"/>
                    </svg>

                    <!-- campo de busca (name=q para compatibilidade com o Google) -->
                    <input class="search-input" type="search" name="q" placeholder="Pesquise na Uniasselvi" aria-label="Pesquisar" autocomplete="off">
                    
                </div>

                <div class="buttons">
                    <button type="submit" class="btn-ghost">Pesquisar Uniasselvi</button>
                    <button type="button" class="btn-ghost">Inscreva-se</button>
                </div>
            </form>
        </div>
        
    </main>
</body>
</html>
